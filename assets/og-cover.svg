<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101211"/>
      <stop offset="1" stop-color="#151815"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#d6f985" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d6f985" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f985"/>
      <stop offset="0.5" stop-color="#7bdcb5"/>
      <stop offset="1" stop-color="#d6f985" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#edfbbd"/>
      <stop offset="0.45" stop-color="#9ece80"/>
      <stop offset="0.78" stop-color="#3f7a5b"/>
      <stop offset="1" stop-color="#173d2d"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid lines -->
  <g stroke="#7bdcb5" stroke-opacity="0.07" stroke-width="1">
    <line x1="80" y1="470" x2="1120" y2="470"/>
    <line x1="80" y1="160" x2="760" y2="160"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(80,74)">
    <rect width="64" height="64" rx="16" fill="#191d19" stroke="#333c32"/>
    <text x="31" y="44" font-family="'JetBrains Mono',monospace" font-size="34" font-weight="700" fill="#f2f1e8" text-anchor="middle">af</text>
    <circle cx="52" cy="42" r="4" fill="#d6f985"/>
  </g>
  <text x="166" y="118" font-family="'JetBrains Mono',monospace" font-size="22" letter-spacing="1" fill="#929e90">PORTFOLIO</text>

  <!-- eyebrow -->
  <g transform="translate(80,236)">
    <circle cx="6" cy="-6" r="6" fill="#d6f985"/>
    <text x="22" y="0" font-family="'JetBrains Mono',monospace" font-size="20" letter-spacing="2" fill="#d6f985">ENGINEER / QA LEADER / SOFTWARE BUILDER</text>
  </g>

  <!-- name / headline -->
  <text x="78" y="336" font-size="78" font-weight="700" fill="#f2f1e8">Ahmad Farid Abbas</text>
  <text x="80" y="416" font-size="40" font-weight="500" fill="#b4bcb1">Thoughtful code. <tspan fill="#d6f985">Exceptional experiences.</tspan></text>

  <!-- tags -->
  <g font-family="'JetBrains Mono',monospace" font-size="19" fill="#b4bcb1">
    <g transform="translate(80,502)">
      <rect x="0" y="-26" width="196" height="40" rx="20" fill="#191d19" stroke="#333c32"/>
      <text x="22" y="0">Native macOS</text>
    </g>
    <g transform="translate(292,502)">
      <rect x="0" y="-26" width="236" height="40" rx="20" fill="#191d19" stroke="#333c32"/>
      <text x="22" y="0">Quality engineering</text>
    </g>
    <g transform="translate(544,502)">
      <rect x="0" y="-26" width="236" height="40" rx="20" fill="#191d19" stroke="#333c32"/>
      <text x="22" y="0">Automation &amp; AI</text>
    </g>
  </g>

  <text x="80" y="582" font-family="'JetBrains Mono',monospace" font-size="18" fill="#929e90">ahmadfaridabbas.com</text>

  <!-- orbital art, right side -->
  <g transform="translate(965,300)">
    <g stroke="url(#orbit)" stroke-width="2" fill="none">
      <ellipse rx="170" ry="60" transform="rotate(-26)"/>
      <ellipse rx="165" ry="62" transform="rotate(36)"/>
      <ellipse rx="150" ry="60" transform="rotate(90)"/>
    </g>
    <circle r="58" fill="url(#core)"/>
    <ellipse rx="58" ry="19" transform="rotate(-26)" fill="none" stroke="#f2f1e8" stroke-opacity="0.35" stroke-width="1.2"/>
    <g fill="#d6f985">
      <circle cx="-150" cy="64" r="6"/>
      <circle cx="146" cy="72" r="5"/>
      <circle cx="0" cy="-152" r="5"/>
    </g>
  </g>
</svg>
